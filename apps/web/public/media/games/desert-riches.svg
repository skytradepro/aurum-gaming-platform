      <path d="M48 -4 C54 -10 58 -22 60 -30 C61 -34 66 -36 70 -34 L74 -31 C75 -29 73 -28 70 -28 L66 -27 C64 -18 60 -6 54 2 Z"/>
      <rect x="4" y="0" width="3" height="20" rx="1.2"/><rect x="12" y="1" width="3" height="19" rx="1.2"/>
      <rect x="38" y="1" width="3" height="19" rx="1.2"/><rect x="46" y="0" width="3" height="20" rx="1.2"/>

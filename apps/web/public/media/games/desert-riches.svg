    <text x="200" y="388" font-size="44" letter-spacing="3" fill="url(#gold)" stroke="#5a2a06" stroke-width="1.4">DESERT</text>
    <text x="200" y="420" font-size="28" letter-spacing="9" fill="#3a1606" opacity="0.9" transform="translate(0 2)">RICHES</text>

    <ellipse cx="262" cy="346" rx="14" ry="6" fill="url(#coin)"/>
    <ellipse cx="244" cy="342" rx="14" ry="6" fill="url(#coin)"/>
    <ellipse cx="340" cy="350" rx="13" ry="5.5" fill="url(#coin)"/>

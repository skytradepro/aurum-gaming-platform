<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 432" width="400" height="432" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
